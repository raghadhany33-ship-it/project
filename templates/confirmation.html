<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - MARASI</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f7f8;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #34495e;
        }

        .confirmation {
            width: 70%;
            margin: 100px auto;
            padding: 50px;
            background-color: white;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1c2b39;
            font-size: 40px;
        }

        h2 {
            color: #c88b6b;
        }

        p {
            font-size: 20px;
        }

        .check {
            font-size: 60px;
        }

        button {
            background-color: #273157e1;
            color: aliceblue;
            border: none;
            cursor: pointer;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="confirmation">

        <div class="check">✓</div>

        <h1>Booking Confirmed!</h1>

        <h2>Thank You, {{ name }} </h2>

        <p>
            Your booking request has been received successfully.
        </p>

        <p>
            We are happy to welcome you to MARASI.
        </p>

        <a href="/">
            <button>Back to Home</button>
        </a>

    </div>

</body>
</html>
